<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="ASAF ARUSI: AI Software Engineer. Sanity check failed, continuing anyway.">
  <style>
    .bg { fill: #07070A; }
    .t { font: 900 128px 'Arial Black', 'Helvetica Neue', Impact, sans-serif; letter-spacing: -6px; }
    .w { fill: #E8E8EA; }
    .r { fill: #FF2E88; mix-blend-mode: screen; animation: r 3.2s steps(1) infinite; }
    .c { fill: #00E5FF; mix-blend-mode: screen; animation: c 2.7s steps(1) infinite; }
    .acid { fill: #C6FF00; }
    .m { font: 15px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #8A8A96; }
    .k { font: 700 13px 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 3px; }
    .l { opacity: 0; animation: in 0.01s forwards; }
    .l1 { animation-delay: 0.3s } .l2 { animation-delay: 0.7s } .l3 { animation-delay: 1.1s } .l4 { animation-delay: 1.6s } .l5 { animation-delay: 2.1s }
    .cur { animation: blink 0.9s steps(1) infinite; }
    .slice { animation: slice 4s steps(1) infinite; }
    @keyframes in { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes r {
      0%, 84%, 100% { transform: translate(-3px, 0); clip-path: inset(0 0 100% 0); }
      85% { transform: translate(-10px, 0); clip-path: inset(8% 0 60% 0); }
      89% { transform: translate(7px, 0); clip-path: inset(45% 0 25% 0); }
      93% { transform: translate(-5px, 0); clip-path: inset(70% 0 2% 0); }
    }
    @keyframes c {
      0%, 78%, 100% { transform: translate(3px, 0); clip-path: inset(100% 0 0 0); }
      79% { transform: translate(11px, 0); clip-path: inset(60% 0 12% 0); }
      83% { transform: translate(-8px, 0); clip-path: inset(18% 0 58% 0); }
      87% { transform: translate(5px, 0); clip-path: inset(2% 0 82% 0); }
    }
    @keyframes slice {
      0%, 90%, 100% { transform: translateX(0); }
      91% { transform: translateX(-26px); }
      93% { transform: translateX(18px); }
      95% { transform: translateX(-8px); }
    }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35" />
    </pattern>
    <clipPath id="band"><rect x="0" y="118" width="1200" height="26" /></clipPath>
  </defs>

  <rect class="bg" width="1200" height="380" />

  <!-- HUD -->
  <text class="k acid" x="48" y="48">PLAYER 1</text>
  <g transform="translate(140 38)">
    <rect width="16" height="10" fill="#C6FF00" /><rect x="20" width="16" height="10" fill="#C6FF00" /><rect x="40" width="16" height="10" fill="#C6FF00" /><rect x="60" width="16" height="10" fill="#C6FF00" /><rect x="80" width="16" height="10" fill="#C6FF00" /><rect x="100" width="16" height="10" fill="#C6FF00" /><rect x="120" width="16" height="10" fill="none" stroke="#3a3a44" />
  </g>
  <text class="k" x="1152" y="48" text-anchor="end" fill="#8A8A96">CLASS <tspan fill="#E8E8EA">AI SOFTWARE ENGINEER</tspan> · PARTY SIZE <tspan fill="#C6FF00">1</tspan></text>

  <!-- Title -->
  <g transform="translate(46 190)">
    <text class="t c">ASAF ARUSI</text>
    <text class="t r">ASAF ARUSI</text>
    <text class="t w">ASAF <tspan class="acid">ARUSI</tspan></text>
  </g>
  <g clip-path="url(#band)">
    <g class="slice" transform="translate(46 190)">
      <rect x="-46" y="-72" width="1200" height="26" fill="#07070A" />
      <text class="t w">ASAF <tspan class="acid">ARUSI</tspan></text>
    </g>
  </g>

  <!-- Boot log -->
  <g transform="translate(48 250)">
    <text class="m l l1" y="0"><tspan fill="#C6FF00">&gt;</tspan> init asaf.exe --mode=overdrive</text>
    <g class="l l2"><text class="m" y="24"><tspan fill="#C6FF00">&gt;</tspan> loading react · typescript · node · postgres · python · c/c++ ........</text><text class="m" x="780" y="24" fill="#C6FF00" style="fill:#C6FF00">[ OK ]</text></g>
    <g class="l l3"><text class="m" y="48"><tspan fill="#C6FF00">&gt;</tspan> spawning ai agents · resolving merge conflicts (team size: 1) .........</text><text class="m" x="780" y="48" style="fill:#C6FF00">[ OK ]</text></g>
    <g class="l l4"><text class="m" y="72"><tspan fill="#C6FF00">&gt;</tspan> sanity check .........................................................</text><text class="m" x="780" y="72" style="fill:#FF2E88">[FAIL]</text></g>
    <text class="m l l5" y="96"><tspan fill="#C6FF00">&gt;</tspan> continuing anyway<tspan class="cur" fill="#C6FF00">█</tspan></text>
  </g>

  <rect width="1200" height="380" fill="url(#scan)" pointer-events="none" />
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none" stroke="#1d1d24" />
</svg>
